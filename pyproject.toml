[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wu2026-photoz-bao"
version = "1.0.0"
description = "Analysis code for a study of BAO reconstruction under photometric-redshift uncertainty"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    {name = "Dennis Wu", email = "denniswu501@gmail.com"},
    {name = "Enrique Paillas"},
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "h5py>=3.6",
    "healpy>=1.16",
    "requests>=2.27",
    "click>=8.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "threadpoolctl>=3.0",
    "emcee>=3.1",
    "iminuit>=2.10",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["cosmology", "BAO", "photometric redshift", "reconstruction", "DESI", "SPHEREx"]

[project.optional-dependencies]
# The cosmodesi stack (pyrecon, pycorr, pypower, cosmoprimo, desilike) and RascalC install from
# pinned git commits through requirements-science.txt; package metadata cannot carry git pins.
dev = ["pytest>=7", "black>=22"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]

[project.scripts]
pzbao = "pzbao.run:main"

[project.urls]
Repository = "https://github.com/denniswu28/wu2026-photoz-bao"

[tool.setuptools.packages.find]
include = ["pzbao", "pzbao.*"]

[tool.setuptools.package-data]
"pzbao.config" = ["analysis.yaml", "frozen_alpha_sn.json"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "lrg_ordering: the fifty-two-element LRG route from raw components to the fitted matrix",
]
