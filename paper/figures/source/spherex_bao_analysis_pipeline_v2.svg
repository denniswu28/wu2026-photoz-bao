<svg width="360" height="560" viewBox="0 0 360 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<g font-family='"Latin Modern Roman", "CMU Serif", "Times New Roman", serif' fill="#222222">
  <rect x="58" y="8" width="244" height="24" rx="12" fill="white" stroke="#999999" stroke-width="0.6" stroke-dasharray="3 2"/>
  <text x="180" y="20" font-size="10" text-anchor="middle" dominant-baseline="central">25 mocks × 5 redshift bins × 5 photo-z samples</text>

  <rect x="52" y="44" width="256" height="44" rx="7" fill="#f1f1f1" stroke="#4d4d4d" stroke-width="0.7"/>
  <text x="180" y="61" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central">DESI AbacusSummit catalogues</text>
  <text x="180" y="77" font-size="10.5" text-anchor="middle" dominant-baseline="central">BGS + LRG; 25 independent phases</text>
  <line x1="180" y1="88" x2="180" y2="104" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="32" y="104" width="296" height="166" rx="8" fill="#e5f5e0" stroke="#33a02c" stroke-width="0.8"/>
  <text x="180" y="124" font-size="13" font-weight="600" fill="#237a20" text-anchor="middle">Catalogue preparation</text>
  <text x="48" y="147" font-size="10.8">1. Remove DESI-specific weights</text>
  <text x="48" y="170" font-size="10.8">2. Inject same-tracer edge reservoir (smeared samples)</text>
  <text x="48" y="193" font-size="10.8">3. Smear data only; select in observed redshift</text>
  <text x="48" y="216" font-size="10.8">4. Downsample galaxies to target number density</text>
  <text x="48" y="239" font-size="10.8">5. Match unsmeared randoms n(z); recompute FKP weights</text>
  <text x="180" y="258" font-size="9.5" fill="#555555" text-anchor="middle">σz = 0 skips smearing; randoms remain unsmeared</text>

  <path d="M180,270 V288 H92 V304" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M180,270 V288 H268 V304" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="18" y="304" width="148" height="52" rx="7" fill="#a6cee3" stroke="#1f78b4" stroke-width="0.8"/>
  <text x="92" y="325" font-size="11.5" font-weight="600" fill="#145584" text-anchor="middle">Pre-reconstruction</text>
  <text x="92" y="343" font-size="10.5" fill="#145584" text-anchor="middle">measure ξ₀(s), ξ₂(s)</text>

  <rect x="194" y="304" width="148" height="52" rx="7" fill="#fdbf6f" stroke="#ff7f00" stroke-width="0.8"/>
  <text x="268" y="325" font-size="11.5" font-weight="600" fill="#9d4e00" text-anchor="middle">RecSym reconstruction</text>
  <text x="268" y="343" font-size="10.5" fill="#9d4e00" text-anchor="middle">Σsm = 15, 20 h⁻¹ Mpc</text>
  <line x1="268" y1="356" x2="268" y2="374" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="194" y="374" width="148" height="42" rx="7" fill="#fb9a99" stroke="#e31a1c" stroke-width="0.8"/>
  <text x="268" y="395" font-size="11" font-weight="600" fill="#a11112" text-anchor="middle">Post-recon ξ₀(s), ξ₂(s)</text>

  <path d="M92,356 V432 H172" fill="none" stroke="#777777" stroke-width="1.2"/>
  <path d="M268,416 V432 H188" fill="none" stroke="#777777" stroke-width="1.2"/>
  <line x1="180" y1="432" x2="180" y2="448" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="38" y="448" width="284" height="64" rx="8" fill="#cab2d6" stroke="#6a3d9a" stroke-width="0.8"/>
  <text x="180" y="469" font-size="12.5" font-weight="600" fill="#553080" text-anchor="middle">BAO inference with desilike</text>
  <text x="180" y="489" font-size="10.5" fill="#553080" text-anchor="middle">MCMC on the 25-mock mean + per-mock profiling</text>
  <text x="180" y="504" font-size="10.5" fill="#553080" text-anchor="middle">αiso, αAP from ℓ = 0 + 2</text>
  <line x1="180" y1="512" x2="180" y2="526" stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="54" y="526" width="252" height="28" rx="7" fill="#f1f1f1" stroke="#4d4d4d" stroke-width="0.7"/>
  <text x="180" y="540" font-size="10.5" font-weight="600" text-anchor="middle" dominant-baseline="central">parameter recovery and reconstruction gain</text>
</g>
</svg>
