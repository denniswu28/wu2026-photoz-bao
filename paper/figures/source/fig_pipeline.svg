    <path d="M2 1L8 5L2 9" fill="none" stroke="#777777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="340" height="598.6" fill="white"/>
<g font-family='"Latin Modern Roman", "CMU Serif", "Times New Roman", serif' fill="#222222">
  <rect x="8" y="4.0" width="324" height="19.4" rx="9.7" fill="white" stroke="#999999" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="170.0" y="13.7" font-size="8.5" fill="#444444" text-anchor="middle" dominant-baseline="central" xml:space="preserve">25 realizations × 5 redshift bins × 5 redshift precision classes (<tspan font-style="italic">σ</tspan><tspan dy="2.04" font-size="5.95">0</tspan><tspan dy="-2.04"> = 0 to 0.03) × 2 caps</tspan></text>
  <line x1="170.0" y1="23.4" x2="170.0" y2="31.4" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="32.4" width="324" height="31.8" rx="5.0" fill="#f3ede4" stroke="#9c8a6c" stroke-width="0.8"/>
  <text x="170.0" y="43.1" font-size="10.2" fill="#222222" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">25 DESI AbacusSummit CutSky mocks</text>
  <text x="170.0" y="54.5" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">BGS and LRG complete catalogs, NGC + SGC</text>
  <line x1="170.0" y1="64.2" x2="170.0" y2="72.2" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="73.2" width="324" height="21.4" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="83.9" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">1. Remove DESI weights</text>
  <line x1="170.0" y1="94.6" x2="170.0" y2="102.6" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="103.6" width="324" height="31.8" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="114.3" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">2. Add padding galaxies beyond the edges</text>
  <text x="170.0" y="125.7" font-size="8.5" fill="#2d5f99" text-anchor="middle" dominant-baseline="central" xml:space="preserve">padding within Δ<tspan font-style="italic">z</tspan> = 0.30</text>
  <line x1="170.0" y1="135.4" x2="170.0" y2="143.4" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="144.4" width="324" height="31.8" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="155.1" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">3. Photo-<tspan font-style="italic">z</tspan> smearing of the galaxies</text>
  <text x="170.0" y="166.5" font-size="8.5" fill="#2d5f99" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-style="italic">σ</tspan><tspan dy="2.04" font-size="5.95">z</tspan><tspan dy="-2.04">/(1+</tspan><tspan font-style="italic">z</tspan>) = 0.001, 0.003, 0.01, 0.03</text>
  <line x1="170.0" y1="176.2" x2="170.0" y2="184.2" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="185.2" width="324" height="31.8" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="195.9" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">4. Select the bin in observed redshift</text>
  <text x="170.0" y="207.3" font-size="8.5" fill="#2d5f99" text-anchor="middle" dominant-baseline="central" xml:space="preserve">0.1–0.2, 0.2–0.4, 0.4–0.6, 0.6–0.8, 0.8–1.0</text>
  <line x1="170.0" y1="217.0" x2="170.0" y2="225.0" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="226.0" width="324" height="41.6" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="236.7" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">5. Thin to the SPHEREx target density</text>
  <text x="170.0" y="248.1" font-size="8.5" fill="#2d5f99" text-anchor="middle" dominant-baseline="central" xml:space="preserve">common count over the 25 realizations</text>
  <text x="170.0" y="258.2" font-size="8.0" fill="#5f5f5f" font-style="italic" text-anchor="middle" dominant-baseline="central" xml:space="preserve">variant: densities matched to the SPHEREx <tspan font-style="italic">V</tspan><tspan dy="1.92" font-size="5.6">eff</tspan><tspan dy="-1.92"> (0.6 ≤ </tspan><tspan font-style="italic">z</tspan> &lt; 1.0)</text>
  <line x1="170.0" y1="267.6" x2="170.0" y2="275.6" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="276.6" width="324" height="31.8" rx="5.0" fill="#e6f0fb" stroke="#4a7fbf" stroke-width="0.8"/>
  <text x="170.0" y="287.3" font-size="10.2" fill="#222222" text-anchor="middle" dominant-baseline="central" xml:space="preserve">6. Match the randoms' <tspan font-style="italic">n</tspan>(<tspan font-style="italic">z</tspan>); FKP weights</text>
  <text x="170.0" y="298.7" font-size="8.5" fill="#2d5f99" text-anchor="middle" dominant-baseline="central" xml:space="preserve">smooth radial template; 50 randoms per galaxy</text>
  <polyline points="170.0,308.4 170.0,315.6" fill="none" stroke="#777777" stroke-width="0.9"/>
  <polyline points="87.0,315.6 253.0,315.6" fill="none" stroke="#777777" stroke-width="0.9"/>
  <line x1="87.0" y1="315.6" x2="87.0" y2="321.8" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <line x1="253.0" y1="315.6" x2="253.0" y2="321.8" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="322.8" width="158.0" height="31.8" rx="5.0" fill="#eaf4e6" stroke="#5a9a4a" stroke-width="0.8"/>
  <text x="87.0" y="333.5" font-size="10.2" fill="#2f6b23" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Pre-recon <tspan font-style="italic">ξ</tspan><tspan dy="2.45" font-size="7.14">ℓ</tspan><tspan dy="-2.45">(</tspan><tspan font-style="italic">s</tspan>)</text>
  <text x="87.0" y="344.9" font-size="8.5" fill="#2f6b23" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-style="italic">ξ</tspan><tspan dy="2.04" font-size="5.95">0</tspan><tspan dy="-2.04">, </tspan><tspan font-style="italic">ξ</tspan><tspan dy="2.04" font-size="5.95">2</tspan><tspan dy="-2.04"> per bin and cap</tspan></text>
  <rect x="174.0" y="322.8" width="158.0" height="61.8" rx="5.0" fill="#fbeae0" stroke="#c9773e" stroke-width="0.8"/>
  <text x="253.0" y="333.5" font-size="10.2" fill="#9c4f1b" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Reconstruction (RecSym)</text>
  <text x="253.0" y="344.9" font-size="8.5" fill="#9c4f1b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">per bin, cap and class</text>
  <text x="253.0" y="355.3" font-size="8.5" fill="#9c4f1b" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-style="italic">Σ</tspan><tspan dy="2.04" font-size="5.95">sm</tspan><tspan dy="-2.04"> = 15 </tspan><tspan font-style="italic">h</tspan><tspan dy="-3.06" font-size="5.95">−1</tspan><tspan dy="3.06"> Mpc</tspan></text>
  <text x="253.0" y="365.4" font-size="8.0" fill="#5f5f5f" font-style="italic" text-anchor="middle" dominant-baseline="central" xml:space="preserve">variants: <tspan font-style="italic">Σ</tspan><tspan dy="1.92" font-size="5.6">sm</tspan><tspan dy="-1.92"> = 25, 35; RecIso;</tspan></text>
  <text x="253.0" y="375.2" font-size="8.0" fill="#5f5f5f" font-style="italic" text-anchor="middle" dominant-baseline="central" xml:space="preserve">cross-<tspan font-style="italic">σ</tspan><tspan dy="1.92" font-size="5.6" font-style="italic">z</tspan><tspan dy="-1.92"> sample, </tspan><tspan font-style="italic">σ</tspan><tspan dy="1.92" font-size="5.6">0</tspan><tspan dy="-1.92"> = 0.003 field</tspan></text>
  <line x1="253.0" y1="384.6" x2="253.0" y2="392.6" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="174.0" y="393.6" width="158.0" height="31.8" rx="5.0" fill="#fbeae0" stroke="#c9773e" stroke-width="0.8"/>
  <text x="253.0" y="404.3" font-size="10.2" fill="#9c4f1b" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">Post-recon <tspan font-style="italic">ξ</tspan><tspan dy="2.45" font-size="7.14">ℓ</tspan><tspan dy="-2.45">(</tspan><tspan font-style="italic">s</tspan>)</text>
  <text x="253.0" y="415.7" font-size="8.5" fill="#9c4f1b" text-anchor="middle" dominant-baseline="central" xml:space="preserve">same galaxies as before</text>
  <polyline points="87.0,354.6 87.0,432.6 253.0,432.6" fill="none" stroke="#777777" stroke-width="0.9"/>
  <polyline points="253.0,425.4 253.0,432.6" fill="none" stroke="#777777" stroke-width="0.9"/>
  <line x1="170.0" y1="432.6" x2="170.0" y2="438.8" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="439.8" width="324" height="42.2" rx="5.0" fill="#ece8f6" stroke="#7a67b5" stroke-width="0.8"/>
  <text x="170.0" y="450.5" font-size="10.2" fill="#4b3a85" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">RascalC covariance</text>
  <text x="170.0" y="461.9" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve">per bin, class, state and cap</text>
  <text x="170.0" y="472.3" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-style="italic">α</tspan><tspan dy="2.04" font-size="5.95">SN</tspan><tspan dy="-2.04"> from the 25-mock scatter; </tspan><tspan font-style="italic">C</tspan>/25 for the mean</text>
  <line x1="170.0" y1="482.0" x2="170.0" y2="490.0" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="491.0" width="324" height="62.4" rx="5.0" fill="#ece8f6" stroke="#7a67b5" stroke-width="0.8"/>
  <text x="170.0" y="501.7" font-size="10.2" fill="#4b3a85" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve">BAO fitting (desilike)</text>
  <text x="170.0" y="513.1" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve">damped template + broadband; photo-<tspan font-style="italic">z</tspan> response fixed</text>
  <text x="170.0" y="523.5" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve">per-bin damping priors; <tspan font-style="italic">α</tspan><tspan dy="2.04" font-size="5.95">iso</tspan><tspan dy="-2.04">, </tspan><tspan font-style="italic">α</tspan><tspan dy="2.04" font-size="5.95">AP</tspan><tspan dy="-2.04"> from </tspan><tspan font-style="italic">ξ</tspan><tspan dy="2.04" font-size="5.95">0</tspan><tspan dy="-2.04">, </tspan><tspan font-style="italic">ξ</tspan><tspan dy="2.04" font-size="5.95">2</tspan></text>
  <text x="170.0" y="533.9" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve">MCMC on the mean; profile-likelihood intervals per realization</text>
  <text x="170.0" y="544.0" font-size="8.0" fill="#5f5f5f" font-style="italic" text-anchor="middle" dominant-baseline="central" xml:space="preserve">variants: PCS2 broadband; flat damping priors</text>
  <line x1="170.0" y1="553.4" x2="170.0" y2="561.4" stroke="#777777" stroke-width="0.9" marker-end="url(#arrow)"/>
  <rect x="8" y="562.4" width="324" height="31.8" rx="5.0" fill="#ece8f6" stroke="#7a67b5" stroke-width="0.8"/>
  <text x="170.0" y="573.1" font-size="10.2" fill="#4b3a85" font-weight="600" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-style="italic">α</tspan> posteriors, FoM<tspan dy="2.45" font-size="7.14">2D</tspan><tspan dy="-2.45"> and gains </tspan><tspan font-style="italic">G</tspan><tspan dy="2.45" font-size="7.14">1D</tspan><tspan dy="-2.45">, </tspan><tspan font-style="italic">G</tspan><tspan dy="2.45" font-size="7.14">2D</tspan></text>
  <text x="170.0" y="584.5" font-size="8.5" fill="#4b3a85" text-anchor="middle" dominant-baseline="central" xml:space="preserve">and the combination of the four classes</text>
</g>
</svg>
